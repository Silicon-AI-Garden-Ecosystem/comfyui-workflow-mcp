description = "Edit one image, with the option to refer to another image."

[params.prompt]
description = "Positive prompt."
target = ["459:484", "inputs", "on_false"]
type = "string"

[params.negative_prompt]
description = "Negative prompt, it only takes effect if `cfg` > 1.0."
target = ["459:474", "inputs", "negative_prompt"]
type = "string"
default = ""

[params.image_1]
description = "The first reference image, use `<image1>` in your prompt."
target = ["470", "inputs", "image"]
type = "file"

[params.image_2]
description = "The second reference image, use `<image2>` in your prompt."
target = ["475", "inputs", "image"]
type = "file"
default = ""

[[params.image_2.hook]]
when = "default"
remove = [["459:474", "inputs", "images.image_2"]]
set = [
  { target = ["459:468", "inputs", "switch"], value = false },
]

[params.cfg]
description = "Classifier-free guidance scale."
target = ["459:458", "inputs", "cfg"]
type = "float"
default = 1.0
range = [1.0, 3.0]

[params.seed]
description = "Seed."
target = ["459:458", "inputs", "seed"]
type = "integer"
default = "random"
range = [0, 9007199254740991]
